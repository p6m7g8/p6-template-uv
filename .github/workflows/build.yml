name: build

on:
  push:
    # main keeps building on push. gh-readonly-queue/** is added because `build`
    # is a required check and the merge queue re-runs required checks on its own
    # ref; merge_group is not dispatching org-wide, so without this the queue
    # waits for a check that never arrives.
    branches: [main, "gh-readonly-queue/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: p6m7g8-actions/checkout@main

      - name: Set up Python
        uses: p6m7g8-actions/python-setup@main

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files
